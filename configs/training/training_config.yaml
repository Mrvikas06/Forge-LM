# ForgeLM Training Configuration
# Pretraining hyperparameters tuned for NVIDIA RTX 3050 (6 GB VRAM).

# --- Batching & Optimization ---
batch_size: 16                    # Micro-batch size per forward pass
gradient_accumulation_steps: 4    # Effective batch size = 16 * 4 = 64
learning_rate: 5.0e-4             # Peak learning rate
min_lr_ratio: 0.1                 # Minimum LR after cosine decay (5.0e-5)
weight_decay: 0.1                 # AdamW weight decay on 2D weight tensors
grad_clip: 1.0                    # Gradient clipping threshold

# --- Schedule ---
max_steps: 10000                  # Total pretraining steps
warmup_steps: 500                 # Linear warmup steps

# --- Evaluation & Checkpoints ---
eval_interval: 250                # Evaluation frequency (in steps)
eval_steps: 50                    # Validation batches per evaluation
checkpoint_interval: 1000         # Checkpoint save frequency (in steps)
checkpoint_dir: "checkpoints"     # Checkpoint save directory

# --- Hardware & Performance ---
mixed_precision: true             # Automatic Mixed Precision (AMP fp16) for 6GB VRAM
device: "auto"                    # 'auto', 'cuda', or 'cpu'
